<!doctype html>
<html lang="es">
<head>
  <meta charset="utf-8">
  <meta name="viewport" content="width=device-width, initial-scale=1">
  <title>Founder | HardToCrack</title>
  <meta name="description" content="Página de contacto del fundador de HardToCrack. Muy pronto.">
  <meta name="theme-color" content="#070b12">
  <link rel="icon" type="image/png" href="assets/ht-logo.png">
  <style>
    :root{
      --bg:#05080d;
      --panel:rgba(13,20,30,.72);
      --line:rgba(255,255,255,.10);
      --text:#f7fbff;
      --muted:#9eacba;
      --cyan:#23b8ff;
      --green:#20e38c;
      --gradient:linear-gradient(120deg,var(--cyan),var(--green));
    }
    *{box-sizing:border-box}
    html,body{min-height:100%}
    body{
      margin:0;
      color:var(--text);
      background:
        radial-gradient(circle at 18% 18%,rgba(35,184,255,.15),transparent 30%),
        radial-gradient(circle at 82% 78%,rgba(32,227,140,.12),transparent 32%),
        linear-gradient(145deg,#030508 0%,#07101a 55%,#05080d 100%);
      font-family:Inter,ui-sans-serif,system-ui,-apple-system,BlinkMacSystemFont,"Segoe UI",sans-serif;
      overflow-x:hidden;
    }
    body:before{
      content:"";
      position:fixed;inset:0;pointer-events:none;opacity:.32;
      background-image:linear-gradient(rgba(255,255,255,.025) 1px,transparent 1px),linear-gradient(90deg,rgba(255,255,255,.025) 1px,transparent 1px);
      background-size:42px 42px;
      mask-image:linear-gradient(to bottom,black,transparent 88%);
    }
    .shell{min-height:100vh;display:grid;place-items:center;padding:32px 20px;position:relative}
    .card{
      width:min(760px,100%);
      padding:58px 42px 38px;
      text-align:center;
      border:1px solid var(--line);
      border-radius:30px;
      background:linear-gradient(180deg,rgba(14,22,33,.84),rgba(8,13,20,.72));
      box-shadow:0 30px 100px rgba(0,0,0,.48),inset 0 1px 0 rgba(255,255,255,.05);
      backdrop-filter:blur(18px);
      position:relative;
      overflow:hidden;
    }
    .card:before{
      content:"";position:absolute;left:15%;right:15%;top:0;height:1px;background:var(--gradient);box-shadow:0 0 24px rgba(35,184,255,.55)
    }
    .logo{width:132px;height:132px;object-fit:contain;filter:drop-shadow(0 0 28px rgba(35,184,255,.18));margin-bottom:18px}
    .brand{font-size:clamp(2rem,7vw,4.25rem);font-weight:800;letter-spacing:-.055em;line-height:.95;margin:0}
    .brand span{background:var(--gradient);-webkit-background-clip:text;background-clip:text;color:transparent}
    .tagline{margin:15px 0 0;color:var(--muted);font-size:.78rem;letter-spacing:.32em;text-transform:uppercase}
    .divider{width:88px;height:3px;border-radius:999px;background:var(--gradient);margin:34px auto}
    .eyebrow{display:inline-flex;align-items:center;gap:9px;padding:8px 13px;border:1px solid rgba(35,184,255,.22);border-radius:999px;color:#dff8ff;background:rgba(35,184,255,.06);font-size:.72rem;font-weight:700;letter-spacing:.18em;text-transform:uppercase}
    .eyebrow:before{content:"";width:7px;height:7px;border-radius:50%;background:var(--green);box-shadow:0 0 14px var(--green)}
    h1{font-size:clamp(2.5rem,8vw,5.5rem);line-height:.93;letter-spacing:-.065em;margin:25px 0 16px}
    h1 strong{display:block;background:var(--gradient);-webkit-background-clip:text;background-clip:text;color:transparent}
    .lead{max-width:560px;margin:0 auto 31px;color:#b9c5d1;font-size:clamp(1rem,2.4vw,1.16rem);line-height:1.7}
    .contacts{display:flex;flex-wrap:wrap;justify-content:center;gap:12px}
    .contact{
      display:inline-flex;align-items:center;gap:10px;min-height:52px;padding:0 18px;border-radius:14px;
      border:1px solid var(--line);color:var(--text);text-decoration:none;background:rgba(255,255,255,.035);
      transition:.22s ease;font-size:.94rem
    }
    .contact:hover{transform:translateY(-2px);border-color:rgba(35,184,255,.45);background:rgba(35,184,255,.07);box-shadow:0 10px 28px rgba(0,0,0,.24)}
    .contact svg{width:18px;height:18px;stroke:url(#mailGradient);fill:none;stroke-width:1.8}
    footer{margin-top:37px;color:#667482;font-size:.75rem;letter-spacing:.08em}
    @media(max-width:600px){.card{padding:43px 20px 28px;border-radius:24px}.logo{width:105px;height:105px}.contact{width:100%;justify-content:center}.tagline{letter-spacing:.18em;font-size:.67rem}}
  </style>
</head>
<body>
  <main class="shell">
    <section class="card" aria-labelledby="title">
      <img class="logo" src="assets/ht-logo.png" alt="Logo HT de HardToCrack">
      <p class="brand">HARD<span>TO</span>CRACK</p>
      <p class="tagline">Security · Privacy · Freedom</p>
      <div class="divider" aria-hidden="true"></div>
      <div class="eyebrow">Founder access</div>
      <h1 id="title">Muy <strong>pronto.</strong></h1>
      <p class="lead">Estamos preparando un acceso privado y directo al ecosistema HardToCrack. Mientras tanto, puede contactar por email.</p>
      <div class="contacts">
        <a class="contact" href="mailto:founder@hardtocrack.com">
          <svg viewBox="0 0 24 24" aria-hidden="true"><defs><linearGradient id="mailGradient" x1="0" x2="1"><stop stop-color="#23b8ff"/><stop offset="1" stop-color="#20e38c"/></linearGradient></defs><rect x="3" y="5" width="18" height="14" rx="2"/><path d="m4 7 8 6 8-6"/></svg>
          founder@hardtocrack.com
        </a>
        <a class="contact" href="mailto:contact@hardtocrack.com">
          <svg viewBox="0 0 24 24" aria-hidden="true"><rect x="3" y="5" width="18" height="14" rx="2"/><path d="m4 7 8 6 8-6"/></svg>
          contact@hardtocrack.com
        </a>
      </div>
      <footer>hardtocrack.com/founder</footer>
    </section>
  </main>
</body>
</html>
